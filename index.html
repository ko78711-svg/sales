<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客戶拜訪與導航管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between max-w-md mx-auto bg-slate-50 border-x border-slate-200 shadow-2xl relative overflow-hidden">

    <!-- Header Navigation -->
    <header class="bg-indigo-600 text-white px-4 py-3.5 shadow-md flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center font-bold text-white shadow">
                <i class="fa-solid me-0.5 fa-map-location-dot"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">拜訪隨身助手</h1>
                <p class="text-xs text-indigo-200">Route & Client Manager</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openImportExportModal()" title="資料備份" class="p-2 text-indigo-100 hover:text-white hover:bg-indigo-700/50 rounded-lg transition">
                <i class="fa-solid fa-file-import text-lg"></i>
            </button>
            <button onclick="openAddModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 font-semibold px-3 py-1.5 rounded-lg text-sm shadow transition flex items-center space-x-1">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>新增</span>
            </button>
        </div>
    </header>

    <!-- Search & Multi-Filter Bar -->
    <div class="bg-white border-b border-slate-200 p-3 space-y-2 z-10">
        <!-- 關鍵字搜尋框 -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" oninput="renderClients()" placeholder="搜尋公司、電話、地址、產業..." class="w-full pl-9 pr-8 py-2 bg-slate-100 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-circle-xmark text-sm"></i>
            </button>
        </div>

        <!-- 區域與產業下拉選單篩選 -->
        <div class="grid grid-cols-3 gap-1.5">
            <select id="cityFilter" onchange="onCityChange()" class="w-full px-2 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500 truncate appearance-menulist">
                <option value="ALL">所有縣市</option>
            </select>
            <select id="districtFilter" onchange="renderClients()" class="w-full px-2 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500 truncate appearance-menulist">
                <option value="ALL">所有鄉鎮區</option>
            </select>
            <select id="industryFilter" onchange="renderClients()" class="w-full px-2 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500 truncate appearance-menulist">
                <option value="ALL">所有產業分類</option>
                <option value="物流業">物流業</option>
                <option value="木業">木業</option>
                <option value="五金工程">五金工程</option>
                <option value="電子製造">電子製造</option>
                <option value="餐飲服務">餐飲服務</option>
            </select>
        </div>
        
        <!-- 拜訪狀態膠囊按鈕列 -->
        <div class="flex items-center space-x-1 overflow-x-auto pb-0.5 text-xs scrollbar-none" id="statusFilterPills">
            <button onclick="setStatusFilter('ALL')" data-status="ALL" class="filter-pill bg-indigo-600 text-white px-2.5 py-1 rounded-full font-medium shadow-sm transition whitespace-nowrap">全部狀態</button>
            <button onclick="setStatusFilter('初訪')" data-status="初訪" class="filter-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-2.5 py-1 rounded-full font-medium transition whitespace-nowrap">初訪</button>
            <button onclick="setStatusFilter('追蹤中')" data-status="追蹤中" class="filter-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-2.5 py-1 rounded-full font-medium transition whitespace-nowrap">追蹤中</button>
            <button onclick="setStatusFilter('報價中')" data-status="報價中" class="filter-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-2.5 py-1 rounded-full font-medium transition whitespace-nowrap">報價中</button>
            <button onclick="setStatusFilter('成交')" data-status="成交" class="filter-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-2.5 py-1 rounded-full font-medium transition whitespace-nowrap">成交</button>
            <button onclick="setStatusFilter('暫緩')" data-status="暫緩" class="filter-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-2.5 py-1 rounded-full font-medium transition whitespace-nowrap">暫緩</button>
        </div>
    </div>

    <!-- Main Content List -->
    <main class="flex-1 overflow-y-auto p-3 space-y-3" id="clientList">
        <!-- 卡片清單將在此渲染 -->
    </main>

    <!-- Empty State Container -->
    <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-400 mb-3 text-2xl">
            <i class="fa-solid fa-folder-open"></i>
        </div>
        <h3 class="font-bold text-slate-700 text-base">目前沒有符合的客戶紀錄</h3>
        <p class="text-xs text-slate-400 mt-1 max-w-xs">點擊上方「新增」建立資料，或載入測試資料。</p>
        <button onclick="loadSampleData()" class="mt-4 px-4 py-2 bg-indigo-50 text-indigo-600 rounded-xl font-medium text-xs hover:bg-indigo-100 transition shadow-sm">
            <i class="fa-solid fa-magic me-1"></i> 載入測試資料
        </button>
    </div>

    <!-- Bottom Tab Navigation -->
    <nav class="bg-white border-t border-slate-200 grid grid-cols-2 text-center text-xs font-medium sticky bottom-0 z-20">
        <button id="tabToday" onclick="switchTab('today')" class="py-3 text-indigo-600 border-t-2 border-indigo-600 flex flex-col items-center justify-center transition">
            <i class="fa-solid fa-calendar-day text-base mb-0.5"></i>
            <span>今日與待拜訪</span>
        </button>
        <button id="tabAll" onclick="switchTab('all')" class="py-3 text-slate-400 border-t-2 border-transparent hover:text-slate-600 flex flex-col items-center justify-center transition">
            <i class="fa-solid fa-list-check text-base mb-0.5"></i>
            <span>所有客戶紀錄</span>
        </button>
    </nav>

    <!-- Add/Edit Client Modal -->
    <div id="clientModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col max-h-[90vh] animate-slide-up">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-lg">新增客戶拜訪</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="clientForm" onsubmit="saveClient(event)" class="p-5 space-y-4 overflow-y-auto">
                <input type="hidden" id="clientId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">公司名稱 *</label>
                    <input type="text" id="companyName" required placeholder="例: 宏泰車業股份有限公司" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="block text-xs font-semibold text-slate-600">產業分類 *</label>
                            <button type="button" onclick="openIndustryManageModal()" class="text-[10px] text-indigo-600 hover:underline">⚙️ 管理選單</button>
                        </div>
                        <!-- 強制使用標準 select 與 appearance-menulist -->
                        <select id="companyIndustry" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white appearance-menulist text-slate-800">
                            <option value="">未分類 / 請選擇</option>
                            <option value="物流業">物流業</option>
                            <option value="木業">木業</option>
                            <option value="五金工程">五金工程</option>
                            <option value="電子製造">電子製造</option>
                            <option value="餐飲服務">餐飲服務</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">聯絡電話</label>
                        <input type="tel" id="companyPhone" placeholder="02-23456789" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">預計拜訪日期 *</label>
                        <input type="date" id="visitDate" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">拜訪階段/結果</label>
                        <select id="visitStatus" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="初訪">初訪</option>
                            <option value="追蹤中">追蹤中</option>
                            <option value="報價中">報價中</option>
                            <option value="成交">成交</option>
                            <option value="暫緩">暫緩</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">公司完整地址 *</label>
                    <input type="text" id="companyAddress" required placeholder="例: 桃園市中壢區延平路200號" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">拜訪紀錄 / 備忘錄</label>
                    <textarea id="visitNotes" rows="3" placeholder="記錄客戶需求、談話重點..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="pt-2 flex items-center space-x-3">
                    <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 border border-slate-300 rounded-xl font-medium text-slate-600 text-sm hover:bg-slate-50 transition">取消</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-indigo-600 rounded-xl font-medium text-white text-sm hover:bg-indigo-700 shadow-md transition">儲存資料</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Industry Management Modal -->
    <div id="industryManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl flex flex-col p-5 space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-800 text-base">管理常用產業選單</h3>
                <button onclick="closeIndustryManageModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="flex space-x-2">
                <input type="text" id="newIndustryInput" placeholder="輸入新產業名稱..." class="flex-1 px-3 py-1.5 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addNewIndustryOption()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-medium hover:bg-indigo-700">新增</button>
            </div>

            <div class="max-h-48 overflow-y-auto space-y-1.5" id="industryTagsList">
                <!-- 產業標籤將在此編輯與刪除 -->
            </div>

            <div class="pt-2 text-right">
                <button onclick="closeIndustryManageModal()" class="px-4 py-1.5 bg-slate-100 text-slate-600 rounded-xl text-xs font-medium">完成</button>
            </div>
        </div>
    </div>

    <!-- Log Visit / Check-in Modal -->
    <div id="checkinModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col animate-slide-up">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-slate-800 text-lg">快速打卡 / 紀錄拜訪</h3>
                    <p id="checkinCompanyName" class="text-xs text-indigo-600 font-medium"></p>
                </div>
                <button onclick="closeCheckinModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="checkinForm" onsubmit="saveCheckin(event)" class="p-5 space-y-4">
                <input type="hidden" id="checkinClientId">
                
                <div class="bg-indigo-50 rounded-xl p-3 text-xs text-indigo-700 flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                    <span>系統將自動更新拜訪日期為 **今日**。</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">更新拜訪階段/結果 *</label>
                    <select id="checkinStatus" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="初訪">初訪</option>
                        <option value="追蹤中">追蹤中</option>
                        <option value="報價中">報價中</option>
                        <option value="成交">成交</option>
                        <option value="暫緩">暫緩</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">新增今日拜訪紀錄 / 備忘錄 *</label>
                    <textarea id="checkinNotes" rows="4" required placeholder="輸入今日與客戶洽談的結果與進度..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="pt-2 flex items-center space-x-3">
                    <button type="button" onclick="closeCheckinModal()" class="w-1/2 py-2.5 border border-slate-300 rounded-xl font-medium text-slate-600 text-sm hover:bg-slate-50 transition">取消</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-indigo-600 rounded-xl font-medium text-white text-sm hover:bg-indigo-700 shadow-md transition">確認打卡紀錄</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Data Import / Export Modal -->
    <div id="importExportModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col animate-slide-up">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-slate-800 text-lg">資料備份與匯入</h3>
                <button onclick="closeImportExportModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="p-5 space-y-4">
                <div>
                    <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-2">快速操作</h4>
                    <button onclick="downloadTemplate();" class="w-full py-2.5 px-3 bg-indigo-50 border border-indigo-100 rounded-xl text-indigo-700 text-xs font-medium hover:bg-indigo-100 transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-file-excel"></i>
                        <span>下載 CSV 空白匯入範本</span>
                    </button>
                </div>

                <hr class="border-slate-100">

                <div class="space-y-2">
                    <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider">JSON / CSV 檔案備份</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="exportJSON()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-download"></i>
                            <span>匯出 JSON</span>
                        </button>
                        <button onclick="exportCSV()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-file-csv text-base"></i>
                            <span>匯出 CSV</span>
                        </button>
                    </div>
                </div>

                <div class="space-y-2">
                    <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider">匯入資料 (JSON)</h4>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importJSON(event)">
                    <button onclick="document.getElementById('importFileInput').click()" class="w-full py-2.5 px-3 border border-dashed border-slate-300 rounded-xl text-slate-600 text-xs font-medium hover:border-indigo-500 hover:text-indigo-600 transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-upload"></i>
                        <span>選擇 JSON 備份檔匯入</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert / Toast Container -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">訊息通知</span>
    </div>

    <script>
        // 全域狀態 State
        let clients = JSON.parse(localStorage.getItem('client_visit_data')) || [];
        let customIndustries = JSON.parse(localStorage.getItem('custom_industries')) || ['物流業', '木業', '五金工程', '電子製造', '餐飲服務'];
        let currentTab = 'today';
        let currentStatusFilter = 'ALL';

        // 預設示範資料 (改為空陣列)
        function getSampleData() {
            return [];
        }

        // 全域 HTML 安全過濾
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 精準解析台灣地址（縣市與鄉鎮區）
        function parseAddress(address) {
            if (!address) return { city: '', district: '' };
            const cityMatch = address.match(/^(.{2,3}[縣市])/);
            const city = cityMatch ? cityMatch[1] : '';
            let remaining = city ? address.replace(city, '') : address;
            const districtMatch = remaining.match(/^(.{1,4}[區市鎮鄉])/);
            const district = districtMatch ? districtMatch[1] : '';
            return { city, district };
        }

        // 更新縣市與鄉鎮區下拉選單
        function updateLocationFilters() {
            const citySelect = document.getElementById('cityFilter');
            const districtSelect = document.getElementById('districtFilter');
            if (!citySelect || !districtSelect) return;

            const selectedCity = citySelect.value || 'ALL';
            const selectedDistrict = districtSelect.value || 'ALL';

            const cities = new Set();
            const districtsByCity = {};

            clients.forEach(c => {
                const { city, district } = parseAddress(c.address);
                if (city) {
                    cities.add(city);
                    if (!districtsByCity[city]) districtsByCity[city] = new Set();
                    if (district) districtsByCity[city].add(district);
                }
            });

            // 選項 HTML 構建
            let cityHTML = '<option value="ALL">所有縣市</option>';
            Array.from(cities).sort().forEach(c => {
                cityHTML += `<option value="${escapeHtml(c)}"${c === selectedCity ? ' selected' : ''}>${escapeHtml(c)}</option>`;
            });
            citySelect.innerHTML = cityHTML;

            let distHTML = '<option value="ALL">所有鄉鎮區</option>';
            let distSet = new Set();
            if (selectedCity === 'ALL') {
                Object.values(districtsByCity).forEach(s => s.forEach(d => distSet.add(d)));
            } else if (districtsByCity[selectedCity]) {
                districtsByCity[selectedCity].forEach(d => distSet.add(d));
            }

            Array.from(distSet).sort().forEach(d => {
                distHTML += `<option value="${escapeHtml(d)}"${d === selectedDistrict ? ' selected' : ''}>${escapeHtml(d)}</option>`;
            });
            districtSelect.innerHTML = distHTML;
        }

        function onCityChange() {
            updateLocationFilters();
            renderClients();
        }

        // 更新產業下拉選單與新增視窗的選單
        function updateIndustryDatalist() {
            const companyIndustrySelect = document.getElementById('companyIndustry');
            const industryFilterSelect = document.getElementById('industryFilter');
            
            const allIndustries = new Set(customIndustries);
            clients.forEach(c => {
                if (c.industry && c.industry.trim()) allIndustries.add(c.industry.trim());
            });

            const sorted = Array.from(allIndustries).sort();

            // 更新新增/編輯 Modal 中的產業下拉選單
            if (companyIndustrySelect) {
                const curVal = companyIndustrySelect.value;
                let options = '<option value="">未分類 / 請選擇</option>';
                sorted.forEach(ind => {
                    options += `<option value="${escapeHtml(ind)}">${escapeHtml(ind)}</option>`;
                });
                companyIndustrySelect.innerHTML = options;
                if (curVal) companyIndustrySelect.value = curVal;
            }

            // 更新頂部篩選器
            if (industryFilterSelect) {
                const cur = industryFilterSelect.value || 'ALL';
                let options = '<option value="ALL">所有產業分類</option>';
                sorted.forEach(ind => {
                    options += `<option value="${escapeHtml(ind)}"${ind === cur ? ' selected' : ''}>${escapeHtml(ind)}</option>`;
                });
                industryFilterSelect.innerHTML = options;
            }
        }

        // 儲存至本地快取
        function saveData() {
            localStorage.setItem('client_visit_data', JSON.stringify(clients));
            localStorage.setItem('custom_industries', JSON.stringify(customIndustries));
            updateLocationFilters();
            updateIndustryDatalist();
            renderClients();
        }

        // 渲染客戶清單卡片
        function renderClients() {
            const listEl = document.getElementById('clientList');
            const emptyEl = document.getElementById('emptyState');
            if (!listEl) return;

            const searchInput = document.getElementById('searchInput');
            const searchVal = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const cityFilter = document.getElementById('cityFilter') ? document.getElementById('cityFilter').value : 'ALL';
            const districtFilter = document.getElementById('districtFilter') ? document.getElementById('districtFilter').value : 'ALL';
            const industryFilter = document.getElementById('industryFilter') ? document.getElementById('industryFilter').value : 'ALL';
            const todayStr = new Date().toISOString().split('T')[0];

            const clearBtn = document.getElementById('clearSearchBtn');
            if (clearBtn) clearBtn.classList.toggle('hidden', searchVal === '');

            // 條件篩選
            let filtered = clients.filter(c => {
                if (currentTab === 'today' && c.visitDate > todayStr) return false;
                if (currentStatusFilter !== 'ALL' && c.status !== currentStatusFilter) return false;
                if (industryFilter !== 'ALL' && c.industry !== industryFilter) return false;

                const { city, district } = parseAddress(c.address);
                if (cityFilter !== 'ALL' && city !== cityFilter) return false;
                if (districtFilter !== 'ALL' && district !== districtFilter) return false;

                if (searchVal) {
                    const mName = (c.name || '').toLowerCase().includes(searchVal);
                    const mAddr = (c.address || '').toLowerCase().includes(searchVal);
                    const mPhone = (c.phone || '').includes(searchVal);
                    const mInd = (c.industry || '').toLowerCase().includes(searchVal);
                    return mName || mAddr || mPhone || mInd;
                }
                return true;
            });

            filtered.sort((a, b) => new Date(a.visitDate) - new Date(b.visitDate));

            if (filtered.length === 0) {
                listEl.innerHTML = '';
                if (emptyEl) emptyEl.classList.remove('hidden');
                return;
            }

            if (emptyEl) emptyEl.classList.add('hidden');
            
            listEl.innerHTML = filtered.map(item => {
                const isToday = item.visitDate === todayStr;
                const isOverdue = item.visitDate < todayStr;
                let dateBadgeClass = 'text-slate-500 bg-slate-100';
                let dateText = item.visitDate;
                
                if (isToday) {
                    dateBadgeClass = 'text-indigo-600 bg-indigo-50 border border-indigo-200 font-semibold';
                    dateText = `今日拜訪 (${item.visitDate})`;
                } else if (isOverdue) {
                    dateBadgeClass = 'text-rose-600 bg-rose-50 border border-rose-200 font-semibold';
                    dateText = `逾期 (${item.visitDate})`;
                }

                // 導航只使用純地址 query=item.address
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.address || '')}`;

                return `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition space-y-3">
                    <div class="flex items-start justify-between space-x-2">
                        <div>
                            <div class="flex items-center space-x-2 flex-wrap">
                                <h2 class="font-bold text-slate-800 text-base leading-snug">${escapeHtml(item.name)}</h2>
                                ${item.industry ? `<span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md font-medium border border-indigo-100">${escapeHtml(item.industry)}</span>` : ''}
                            </div>
                            <div class="inline-block mt-1">
                                <span class="text-[11px] px-2 py-0.5 rounded-full ${dateBadgeClass}">
                                    <i class="fa-regular fa-calendar me-1"></i>${dateText}
                                </span>
                            </div>
                        </div>
                        <div>
                            <span class="px-2.5 py-0.5 rounded-md border text-[11px] font-semibold ${getStatusClass(item.status)}">${escapeHtml(item.status)}</span>
                        </div>
                    </div>

                    <div class="text-xs text-slate-600 space-y-1.5 bg-slate-50 p-2.5 rounded-xl">
                        <div class="flex items-center text-slate-700">
                            <i class="fa-solid fa-location-dot w-4 text-indigo-500 flex-shrink-0"></i>
                            <span class="truncate">${escapeHtml(item.address)}</span>
                        </div>
                        ${item.phone ? `
                        <div class="flex items-center text-slate-700">
                            <i class="fa-solid fa-phone w-4 text-emerald-500 flex-shrink-0"></i>
                            <a href="tel:${item.phone}" class="hover:underline font-mono">${escapeHtml(item.phone)}</a>
                        </div>
                        ` : ''}
                        ${item.notes ? `
                        <div class="flex items-start text-slate-600 pt-1 border-t border-slate-200/60 mt-1">
                            <i class="fa-solid fa-sticky-note w-4 text-amber-500 flex-shrink-0 mt-0.5"></i>
                            <p class="whitespace-pre-line text-[11px] leading-relaxed flex-1">${escapeHtml(item.notes)}</p>
                        </div>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-4 gap-2 pt-1">
                        <a href="${mapUrl}" target="_blank" class="col-span-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2 flex flex-col items-center justify-center text-[11px] font-medium transition shadow-sm">
                            <i class="fa-solid fa-diamond-turn-right text-sm mb-0.5"></i>
                            <span>導航</span>
                        </a>
                        <button onclick="openCheckinModal('${item.id}')" class="col-span-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl py-2 flex flex-col items-center justify-center text-[11px] font-medium transition shadow-sm">
                            <i class="fa-solid fa-user-check text-sm mb-0.5"></i>
                            <span>打卡</span>
                        </button>
                        <button onclick="editClient('${item.id}')" class="col-span-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl py-2 flex flex-col items-center justify-center text-[11px] font-medium transition">
                            <i class="fa-solid fa-pen-to-square text-sm mb-0.5 text-slate-500"></i>
                            <span>編輯</span>
                        </button>
                        <button onclick="deleteClient('${item.id}')" class="col-span-1 bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-500 rounded-xl py-2 flex flex-col items-center justify-center text-[11px] font-medium transition">
                            <i class="fa-solid fa-trash-can text-sm mb-0.5"></i>
                            <span>刪除</span>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function getStatusClass(status) {
            const map = {
                '初訪': 'bg-sky-100 text-sky-700 border-sky-200',
                '追蹤中': 'bg-amber-100 text-amber-700 border-amber-200',
                '報價中': 'bg-purple-100 text-purple-700 border-purple-200',
                '成交': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                '暫緩': 'bg-slate-100 text-slate-600 border-slate-200'
            };
            return map[status] || 'bg-slate-100 text-slate-600 border-slate-200';
        }

        // 分頁與狀態切換
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabToday').className = tab === 'today' ? "py-3 text-indigo-600 border-t-2 border-indigo-600 flex flex-col items-center justify-center transition" : "py-3 text-slate-400 border-t-2 border-transparent hover:text-slate-600 flex flex-col items-center justify-center transition";
            document.getElementById('tabAll').className = tab === 'all' ? "py-3 text-indigo-600 border-t-2 border-indigo-600 flex flex-col items-center justify-center transition" : "py-3 text-slate-400 border-t-2 border-transparent hover:text-slate-600 flex flex-col items-center justify-center transition";
            renderClients();
        }

        function setStatusFilter(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-pill').forEach(pill => {
                if (pill.getAttribute('data-status') === status) {
                    pill.className = "filter-pill bg-indigo-600 text-white px-2.5 py-1 rounded-full font-medium shadow-sm transition whitespace-nowrap";
                } else {
                    pill.className = "filter-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-2.5 py-1 rounded-full font-medium transition whitespace-nowrap";
                }
            });
            renderClients();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderClients();
        }

        // Modal 操作
        function openAddModal() {
            document.getElementById('modalTitle').innerText = '新增客戶拜訪';
            document.getElementById('clientId').value = '';
            document.getElementById('clientForm').reset();
            document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];
            
            // iPhone 專用強刷與延遲更新
            updateIndustryDatalist();
            setTimeout(() => { updateIndustryDatalist(); }, 100);

            document.getElementById('clientModal').classList.remove('hidden');
        }

        function editClient(id) {
            const c = clients.find(item => item.id === id);
            if (!c) return;
            document.getElementById('modalTitle').innerText = '編輯客戶紀錄';
            document.getElementById('clientId').value = c.id;
            document.getElementById('companyName').value = c.name;
            
            updateIndustryDatalist();
            setTimeout(() => {
                document.getElementById('companyIndustry').value = c.industry || '';
            }, 50);

            document.getElementById('companyPhone').value = c.phone || '';
            document.getElementById('companyAddress').value = c.address;
            document.getElementById('visitDate').value = c.visitDate;
            document.getElementById('visitStatus').value = c.status;
            document.getElementById('visitNotes').value = c.notes || '';
            document.getElementById('clientModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('clientModal').classList.add('hidden');
        }

        function saveClient(e) {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const name = document.getElementById('companyName').value.trim();
            const industry = document.getElementById('companyIndustry').value.trim();
            const phone = document.getElementById('companyPhone').value.trim();
            const address = document.getElementById('companyAddress').value.trim();
            const visitDate = document.getElementById('visitDate').value;
            const status = document.getElementById('visitStatus').value;
            const notes = document.getElementById('visitNotes').value.trim();

            if (industry && !customIndustries.includes(industry)) {
                customIndustries.push(industry);
            }

            if (id) {
                const idx = clients.findIndex(c => c.id === id);
                if (idx !== -1) clients[idx] = { id, name, industry, phone, address, visitDate, status, notes };
                showToast('已更新客戶資料');
            } else {
                clients.push({ id: 'client-' + Date.now(), name, industry, phone, address, visitDate, status, notes });
                showToast('已新增客戶拜訪');
            }

            saveData();
            closeModal();
        }

        function deleteClient(id) {
            const c = clients.find(item => item.id === id);
            if (!c) return;
            if (confirm(`確定刪除「${c.name}」嗎？`)) {
                clients = clients.filter(item => item.id !== id);
                saveData();
                showToast('已成功刪除');
            }
        }

        // 產業選單管理
        function openIndustryManageModal() {
            renderIndustryTags();
            document.getElementById('industryManageModal').classList.remove('hidden');
        }
        function closeIndustryManageModal() {
            document.getElementById('industryManageModal').classList.add('hidden');
        }
        function renderIndustryTags() {
            const container = document.getElementById('industryTagsList');
            container.innerHTML = customIndustries.map((ind, idx) => `
                <div class="flex items-center justify-between bg-slate-50 px-3 py-1.5 rounded-lg border text-xs">
                    <span class="font-medium text-slate-700">${escapeHtml(ind)}</span>
                    <button onclick="removeIndustryOption(${idx})" class="text-rose-500 hover:text-rose-700">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }
        function addNewIndustryOption() {
            const input = document.getElementById('newIndustryInput');
            const val = input.value.trim();
            if (val && !customIndustries.includes(val)) {
                customIndustries.push(val);
                input.value = '';
                saveData();
                renderIndustryTags();
            }
        }
        function removeIndustryOption(idx) {
            customIndustries.splice(idx, 1);
            saveData();
            renderIndustryTags();
        }

        // 打卡與備份
        function openCheckinModal(id) {
            const c = clients.find(item => item.id === id);
            if (!c) return;
            document.getElementById('checkinClientId').value = c.id;
            document.getElementById('checkinCompanyName').innerText = c.name;
            document.getElementById('checkinStatus').value = c.status;
            document.getElementById('checkinNotes').value = '';
            document.getElementById('checkinModal').classList.remove('hidden');
        }
        function closeCheckinModal() {
            document.getElementById('checkinModal').classList.add('hidden');
        }

        // Import & Export Modal
        function openImportExportModal() {
            document.getElementById('importExportModal').classList.remove('hidden');
        }

        function closeImportExportModal() {
            document.getElementById('importExportModal').classList.add('hidden');
        }

        // 下載空白 CSV 匯入範本
        function downloadTemplate() {
            let csvContent = "\uFEFF公司名稱,產業分類,電話,地址,預計拜訪日期,拜訪階段,拜訪紀錄\n";
            csvContent += '"範例公司(請刪除本行)","物流業","02-12345678","桃園市中壢區延平路100號","2026-11-15","初訪","初步拜訪聯絡人"';
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `客戶拜訪匯入範本.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('已下載空白匯入範本');
        }

        // Export JSON
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `client_visits_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            showToast('已匯出 JSON');
        }

        function exportCSV() {
            if (clients.length === 0) return showToast('目前無資料');
            let csv = "\uFEFF公司名稱,產業分類,電話,地址,拜訪日期,拜訪階段,拜訪紀錄\n";
            clients.forEach(c => {
                csv += `"${(c.name||'')}","${(c.industry||'')}","${(c.phone||'')}","${(c.address||'')}","${c.visitDate}","${c.status}","${(c.notes||'').replace(/\n/g,' ')}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `client_visits_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            showToast('已匯出 CSV');
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        clients = imported;
                        saveData();
                        closeImportExportModal();
                        showToast('匯入成功！');
                    }
                } catch(err) { alert('解析檔案失敗'); }
            };
            reader.readAsText(file);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            t.classList.add('opacity-100');
            setTimeout(() => {
                t.classList.remove('opacity-100');
                t.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // 頁面初始化
        window.onload = function() {
            if (!localStorage.getItem('client_visit_data')) {
                clients = [];
                localStorage.setItem('client_visit_data', JSON.stringify(clients));
            }
            updateLocationFilters();
            updateIndustryDatalist();
            renderClients();
        };
    </script>
</body>
</html>
